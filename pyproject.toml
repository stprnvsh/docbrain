[project]
name = "docbrain"
version = "0.1.0"
description = "Local-first multi-format document understanding pipeline with a cross-document context brain"
requires-python = ">=3.12"
dependencies = [
    "pymupdf>=1.24",
    "pymupdf4llm>=0.0.17",
    "openpyxl>=3.1",
    "pandas>=2.2",
    "pyarrow>=16",
    "duckdb>=1.0",
    "clevercsv>=0.8",
    "charset-normalizer>=3.3",
    "typer>=0.12",
    "rich>=13",
    "pydantic>=2.7",
    "anthropic>=0.40",
    "matplotlib>=3.9",
    "pyyaml>=6.0",
    "pandera>=0.24",
]

[project.optional-dependencies]
attest = ["cryptography>=42"]
contracts = ["datacontract-cli>=0.10"]
lineage = ["openlineage-python>=1.20"]
matching = ["bdi-kit>=0.6"]
docling = ["docling>=2.0"]

[project.scripts]
docbrain = "docbrain.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["docbrain"]
